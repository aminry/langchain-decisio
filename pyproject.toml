[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-decisio"
version = "0.1.0"
description = "LangChain components for Decisio: a classifier, a router and a tool-risk gate"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Amin Roudaki" }]
keywords = ["langchain", "decisio", "classification", "routing", "guardrails", "agents", "system-one"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=1.6,<2",
    "httpx>=0.28",
]

[project.optional-dependencies]
# DecisioToolGate is agent middleware, so it needs LangChain's agent framework.
agents = ["langchain>=1.4,<2"]

[project.urls]
Repository = "https://github.com/aminry/langchain-decisio"
Decisio = "https://github.com/aminry/decisio"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.0", "ruff>=0.16", "langchain>=1.4,<2", "langgraph>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_decisio"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
